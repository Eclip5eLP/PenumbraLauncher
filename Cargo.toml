[workspace]
resolver = "3"
members = ["crates/penumbra-core", "crates/penumbra-pack", "apps/launcher/src-tauri"]

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "LicenseRef-AllRightsReserved"
repository = "https://github.com/Eclip5eLP/PenumbraLauncher"

[workspace.dependencies]
penumbra-core = { path = "crates/penumbra-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tracing = "0.1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Fast dev builds but optimized deps (hashing/zstd are slow unoptimized)
[profile.dev.package."*"]
opt-level = 2
