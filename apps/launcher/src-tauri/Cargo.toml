[package]
name = "penumbra-launcher"
version = "0.1.0"
description = "Penumbra Launcher"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "penumbra_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
penumbra-core.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2"] }
blake3.workspace = true
zstd.workspace = true
rayon.workspace = true
zip.workspace = true
sha2.workspace = true
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_Security"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
